wiki:
  publicBaseUrl: https://wiki.example.internal
  auth:
    mode: oidc
    oidc:
      authority: https://login.example.internal
      clientId: copernica
      clientSecret: { secretName: credential-sentinel, key: credential-sentinel-oidc }
  azureDevOps:
    syncCredential:
      type: servicePrincipal
      tenantId: tenant
      clientId: client
      clientSecret: { secretName: credential-sentinel, key: credential-sentinel-ado }
  spaces:
    - id: handbook
      remoteUrl: https://git.example.internal/handbook.git
      credential:
        username: wiki
        token: { secretName: credential-sentinel, key: credential-sentinel-git }
