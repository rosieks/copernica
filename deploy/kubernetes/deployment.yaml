apiVersion: apps/v1
kind: Deployment
metadata:
  name: copernica
  labels:
    app.kubernetes.io/name: copernica
spec:
  # Single replica by design (Constitution V): writes are serialized in-process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: copernica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copernica
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copernica
          image: copernica:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: copernica
                optional: true
          env:
            - name: Copernica__PublicBaseUrl
              value: https://wiki.example.internal
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: copernica-data
        - name: tmp
          emptyDir: {}
