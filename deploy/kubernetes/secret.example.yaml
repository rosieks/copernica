# Example only — create the real secret with your own values, never commit it.
# Every key becomes an environment variable of the pod (contracts/configuration.md).
apiVersion: v1
kind: Secret
metadata:
  name: copernica
type: Opaque
stringData:
  Copernica__Auth__Mode: EntraId
  Copernica__Auth__EntraId__TenantId: 00000000-0000-0000-0000-000000000000
  Copernica__Auth__EntraId__ClientId: 00000000-0000-0000-0000-000000000000
  Copernica__Auth__EntraId__ClientSecret: change-me
  Copernica__AzureDevOps__SyncCredential__Type: Pat
  Copernica__AzureDevOps__SyncCredential__Pat: change-me-read-only
  Copernica__Spaces__0__Id: handbook
  Copernica__Spaces__0__DisplayName: Team Handbook
  Copernica__Spaces__0__Provider: AzureDevOps
  Copernica__Spaces__0__RemoteUrl: https://dev.azure.com/contoso/Platform/_git/handbook
