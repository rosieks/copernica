# Example only: exposure outside the cluster is the deployer's decision (Constitution III).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copernica
spec:
  ingressClassName: nginx
  tls:
    - hosts: [wiki.example.internal]
      secretName: copernica-tls
  rules:
    - host: wiki.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copernica
                port:
                  name: http
