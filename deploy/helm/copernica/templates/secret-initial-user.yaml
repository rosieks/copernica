{{- if include "copernica.generatesInitialUser" . }}
{{- $name := include "copernica.initialUserSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "copernica.labels" . | nindent 4 }}
  annotations:
    # Generated once; kept across upgrades and uninstalls so the password never changes.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
